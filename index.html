
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0e2238">
<title>Catálogo de invierno | Marialfe</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Georgia,serif;
  --c1:#0e2238;
  --c2:#1b3d5e;
  background:#0e2238;
  color:#eef5fb;
  min-height:100vh;
  padding-bottom:140px
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  z-index:-1;
  background:linear-gradient(var(--c1),var(--c2))
}

header{
  text-align:center;
  padding:48px 16px 16px
}

h1{
  margin:0;
  font-size:2.4rem;
  font-weight:normal;
  letter-spacing:.02em
}

header p{
  opacity:.85;
  margin:8px 0 0
}

.instagram-header{
  display:inline-block;
  margin-top:18px;
  padding:10px 18px;
  border:1px solid rgba(255,255,255,.55);
  border-radius:24px;
  color:#fff;
  text-decoration:none;
  transition:background .2s,transform .2s
}

.instagram-header:hover{
  background:rgba(255,255,255,.14);
  transform:translateY(-2px)
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  gap:20px;
  max-width:1000px;
  margin:32px auto;
  padding:0 16px;
  position:relative;
  z-index:2
}

.card{
  background:#f6fafd;
  color:#16283a;
  border-radius:10px;
  padding:14px;
  transition:transform .2s
}

.card:hover{transform:translateY(-4px)}

.card .img{
  aspect-ratio:1/1;
  border-radius:8px;
  background:#cfe0ee;
  margin-bottom:12px;
  overflow:hidden
}

.card .img img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  transition:transform .4s
}

.card:hover .img img{transform:scale(1.06)}

.card h3{
  margin:0 0 4px;
  font-size:1.1rem
}

.card span{
  font-size:.95rem;
  opacity:.7
}

.catalog-footer{
  text-align:center;
  padding:20px 16px 35px;
  position:relative;
  z-index:2
}

.catalog-footer p{line-height:1.6}

.instagram-link{
  display:inline-block;
  padding:12px 22px;
  background:#fff;
  color:#16283a;
  border-radius:25px;
  text-decoration:none;
  transition:transform .2s
}

.instagram-link:hover{transform:scale(1.04)}

@media(max-width:600px){
  h1{font-size:1.9rem}

  .grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:12px;
    padding:0 12px
  }

  .card{padding:10px}
  .card h3{font-size:.95rem}

  body{padding-bottom:190px}
}

/* NIEVE */
#nieve{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  pointer-events:none;
  z-index:3
}

#nieve-btn{
  position:fixed;
  right:16px;
  bottom:16px;
  z-index:10;
  border:0;
  border-radius:20px;
  padding:10px 16px;
  background:#fff;
  color:#16283a;
  cursor:pointer;
  font:inherit;
  box-shadow:0 2px 8px rgba(0,0,0,.3)
}

/* MUÑEQUITOS */
#amigos{
  position:fixed;
  left:12px;
  bottom:8px;
  z-index:5;
  display:flex;
  gap:6px;
  align-items:flex-end
}

.amigo{
  position:relative;
  font-size:2.6rem;
  line-height:1;
  cursor:pointer;
  user-select:none;
  background:none;
  border:0;
  padding:0;
  transition:transform .2s
}

.amigo:hover{transform:scale(1.15) rotate(-6deg)}
.amigo.salta{animation:salto .5s}

@keyframes salto{
  40%{transform:translateY(-22px)}
}

.globo{
  position:absolute;
  bottom:110%;
  left:0;
  min-width:140px;
  max-width:190px;
  background:#fff;
  color:#16283a;
  font:.8rem/1.4 Georgia,serif;
  padding:9px 11px;
  border-radius:12px;
  box-shadow:0 2px 8px rgba(0,0,0,.3);
  opacity:0;
  transform:translateY(6px);
  transition:opacity .3s,transform .3s;
  pointer-events:none;
  text-align:left
}

.globo::after{
  content:"";
  position:absolute;
  top:100%;
  left:18px;
  border:7px solid transparent;
  border-top-color:#fff
}

.globo.ver{
  opacity:1;
  transform:none
}

@media(max-width:600px){
  #amigos .amigo:nth-child(n+3){display:none}
  .amigo{font-size:2.1rem}
}

/* OLAF */
#olaf{
  position:fixed;
  right:12px;
  bottom:64px;
  z-index:5;
  width:150px;
  cursor:pointer;
  animation:rebote 2.4s ease-in-out infinite;
  -webkit-tap-highlight-color:transparent
}

#olaf svg{
  width:100%;
  height:auto;
  display:block;
  filter:drop-shadow(0 6px 10px rgba(0,0,0,.35))
}

#olaf .brazo{
  transform-origin:112px 98px;
  animation:saludo .7s ease-in-out infinite alternate
}

#olaf.feliz .brazo{animation-duration:.25s}

@keyframes saludo{
  from{transform:rotate(-28deg)}
  to{transform:rotate(14deg)}
}

@keyframes rebote{
  50%{transform:translateY(-6px)}
}

#olaf-globo{
  position:absolute;
  bottom:100%;
  right:10px;
  width:165px;
  background:#fff;
  color:#16283a;
  font:.85rem/1.4 Georgia,serif;
  padding:9px 11px;
  border-radius:12px;
  box-shadow:0 2px 8px rgba(0,0,0,.3);
  text-align:center;
  transition:opacity .3s
}

#olaf-globo::after{
  content:"";
  position:absolute;
  top:100%;
  right:28px;
  border:7px solid transparent;
  border-top-color:#fff
}

@media(max-width:600px){
  #olaf{width:105px}
  #olaf-globo{width:130px;font-size:.75rem}
}

@media(prefers-reduced-motion:reduce){
  #olaf,#olaf .brazo,.amigo,.card .img img{
    animation:none;
    transition:none
  }
}
</style>
</head>

<body>

<!-- NIEVE -->
<canvas id="nieve"></canvas>
<button id="nieve-btn" type="button">❄ Nieve: on</button>

<script>
(function(){
  var c = document.getElementById('nieve');
  var ctx = c.getContext('2d');
  var btn = document.getElementById('nieve-btn');
  var flakes = [];
  var mouse = {x:-999,y:-999};
  var on = true;
  var reduce = window.matchMedia(
    '(prefers-reduced-motion: reduce)'
  ).matches;

  var COUNT = innerWidth < 600 ? 60 : 130;

  function resize(){
    c.width = innerWidth;
    c.height = innerHeight;
  }

  addEventListener('resize',resize);
  resize();

  function flake(x,y){
    return {
      x:x != null ? x : Math.random()*c.width,
      y:y != null ? y : Math.random()*c.height,
      r:Math.random()*2.8+1,
      vy:Math.random()*0.8+0.4,
      sway:Math.random()*Math.PI*2,
      vx:0
    };
  }

  for(var i=0;i<COUNT;i++){
    flakes.push(flake());
  }

  addEventListener('mousemove',function(e){
    mouse.x=e.clientX;
    mouse.y=e.clientY;
  });

  function dedo(e){
    var t=e.touches[0];
    if(t){
      mouse.x=t.clientX;
      mouse.y=t.clientY;
    }
  }

  addEventListener('touchstart',dedo,{passive:true});
  addEventListener('touchmove',dedo,{passive:true});

  addEventListener('touchend',function(){
    mouse.x=mouse.y=-999;
  },{passive:true});

  addEventListener('click',function(e){
    if(e.target.closest('button,a,#olaf,#amigos')) return;

    for(var i=0;i<25;i++){
      var f=flake(e.clientX,e.clientY);
      f.vx=(Math.random()-0.5)*5;
      f.vy=Math.random()*2+0.5;
      f.burst=true;
      flakes.push(f);
    }
  });

  btn.addEventListener('click',function(e){
    e.stopPropagation();
    on=!on;
    c.style.display=on?'block':'none';
    btn.textContent='❄ Nieve: '+(on?'on':'off');
  });

  function draw(){
    if(on){
      ctx.clearRect(0,0,c.width,c.height);
      ctx.fillStyle='rgba(255,255,255,.9)';

      for(var i=flakes.length-1;i>=0;i--){
        var f=flakes[i];
        f.sway+=0.015;

        var dx=f.x-mouse.x;
        var dy=f.y-mouse.y;
        var d=Math.sqrt(dx*dx+dy*dy);

        if(d<90&&d>0){
          f.vx+=(dx/d)*0.6;
        }

        f.vx*=0.95;
        f.x+=Math.sin(f.sway)*0.4+f.vx;
        f.y+=f.vy;

        if(f.y>c.height+5){
          if(f.burst){
            flakes.splice(i,1);
            continue;
          }
          f.y=-5;
          f.x=Math.random()*c.width;
        }

        if(f.x>c.width+5)f.x=-5;
        if(f.x< -5)f.x=c.width+5;

        ctx.beginPath();
        ctx.arc(f.x,f.y,f.r,0,Math.PI*2);
        ctx.fill();
      }
    }

    requestAnimationFrame(draw);
  }

  if(reduce){
    on=false;
    c.style.display='none';
    btn.textContent='❄ Nieve: off';
  }

  draw();
})();
</script>

<!-- MUÑEQUITOS -->
<div id="amigos">

  <button
    class="amigo"
    type="button"
    title="Visita el Instagram de Marialfe"
    aria-label="Papá Noel: visita el Instagram de Marialfe"
    data-dice='[
      "¡Tenemos el detalle perfecto para ti! 🎁",
      "Sorprende a alguien especial con Marialfe ❤️",
      "Encuentra ese regalito que tanto buscas ✨",
      "¡Tu próximo accesorio favorito te espera! 🎀",
      "Regala momentos bonitos esta Navidad 🎄",
      "¡En Marialfe tenemos algo para ti! 💝"
    ]'>🎅<div class="globo"></div>
  </button>

  <button
    class="amigo"
    type="button"
    data-dice='[
      "¡Hola! Soy Olaf... casi 😄",

      "¡Abrígate bien! ❄️"
    ]'>⛄<div class="globo"></div>
  </button>

  <button
    class="amigo"

    ]'>🦌<div class="globo"></div>
  </button>

  <button
    class="amigo"
    type="button"

      "Tu árbol necesita algo nuevo 🎄"
    ]'>🎄<div class="globo"></div>
  </button>

</div>

<script>
(function(){
  var amigos=document.querySelectorAll('#amigos .amigo');

  function hablar(a,i){
    var frases=JSON.parse(a.dataset.dice);
    var g=a.querySelector('.globo');

    g.textContent=frases[
      i!=null?i:Math.floor(Math.random()*frases.length)
    ];

    g.classList.add('ver');

    clearTimeout(a._t);

    a._t=setTimeout(function(){
      g.classList.remove('ver');
    },4000);
  }

  amigos.forEach(function(a,i){
    a.addEventListener('click',function(e){
      e.stopPropagation();

      a.classList.remove('salta');
      void a.offsetWidth;
      a.classList.add('salta');

      hablar(a);

      // Papá Noel abre el perfil de Instagram de Marialfe
      if(i===0){
        window.open(
          'https://www.instagram.com/accesoriosmarialfe_/',
          '_blank',
          'noopener,noreferrer'
        );
      }
    });
  });

  // Papá Noel da la bienvenida automáticamente
  setTimeout(function(){
    hablar(amigos[0],0);
  },1200);

  // Los muñequitos siguen hablando automáticamente
  var turno=0;

  setInterval(function(){
    turno=(turno+1)%amigos.length;
    hablar(amigos[turno]);
  },6000);
})();
</script>

<script>
(function(){
  var etapas=[
    {
      c1:[14,34,56],
      c2:[27,61,94],
      msg:"¡Hola! Tenemos el detalle perfecto para ti 🎁"
    },
    {
      c1:[38,28,84],
      c2:[78,48,120],
      msg:"¡Sigue bajando, hay más sorpresas! 🎄"
    },
    {
      c1:[6,8,28],
      c2:[20,22,58],
      msg:"Ya es de noche… ¡y siguen los regalos! 🌙"
    },
    {
      c1:[10,62,66],
      c2:[36,120,104],
      msg:"¡Encuentra algo especial en Marialfe! ✨"
    },
    {
      c1:[110,48,70],
      c2:[222,128,84],
      msg:"¡Gracias por visitar nuestro catálogo! ❤️"
    }
  ];

  var olaf=document.getElementById('olaf');
  var globo=document.getElementById('olaf-globo');
  var ultima=-1;
  var root=document.body;

  function mezcla(a,b,t){
    return a.map(function(v,i){
      return Math.round(v+(b[i]-v)*t);
    }).join(',');
  }

  function actualizar(){
    var max=document.documentElement.scrollHeight-innerHeight;
    var p=max>0?Math.min(1,Math.max(0,scrollY/max)):0;
    var pos=p*(etapas.length-1);
    var i=Math.min(etapas.length-2,Math.floor(pos));
    var t=pos-i;

    root.style.setProperty(
      '--c1',
      'rgb('+mezcla(etapas[i].c1,etapas[i+1].c1,t)+')'
    );

    root.style.setProperty(
      '--c2',
      'rgb('+mezcla(etapas[i].c2,etapas[i+1].c2,t)+')'
    );

    var cercana=Math.round(pos);

    if(cercana!==ultima){
      ultima=cercana;
      globo.textContent=etapas[cercana].msg;
    }
  }

  addEventListener('scroll',actualizar,{passive:true});
  addEventListener('resize',actualizar);
  addEventListener('load',actualizar);

  actualizar();

  function visitarInstagram(){
    window.open(
      'https://www.instagram.com/accesoriosmarialfe_/',
      '_blank',
      'noopener,noreferrer'
    );
  }

  olaf.addEventListener('click',function(e){
    e.stopPropagation();

    olaf.classList.add('feliz');
    globo.textContent='¡Tenemos el detalle perfecto para ti! 🎁';

    visitarInstagram();

    setTimeout(function(){
      olaf.classList.remove('feliz');
      globo.textContent=etapas[Math.max(0,ultima)].msg;
    },2500);
  });

  olaf.addEventListener('keydown',function(e){
    if(e.key==='Enter'||e.key===' '){
      e.preventDefault();
      olaf.click();
    }
  });
})();
</script>

<script>
// Generar automáticamente los 65 productos
(function(){
  var catalogo=document.getElementById('catalogo');
  var fragment=document.createDocumentFragment();

  for(var i=1;i<=65;i++){
    var card=document.createElement('div');
    card.className='card';

    var imagen=document.createElement('div');
    imagen.className='img';

    var img=document.createElement('img');

    // Evita la caché antigua de la foto 47
    img.src=i===47?'47.jpeg?v=2':i+'.jpeg';
    img.alt='Set navideño '+i;
    img.loading='lazy';
    img.decoding='async';

    img.onerror=function(){
      this.style.display='none';
    };

    var titulo=document.createElement('h3');
    titulo.textContent='Set navideño '+i;

    var precio=document.createElement('span');
    precio.textContent='$20.000';

    imagen.appendChild(img);
    card.appendChild(imagen);
    card.appendChild(titulo);
    card.appendChild(precio);

    fragment.appendChild(card);
  }

  catalogo.appendChild(fragment);
})();
</script>
